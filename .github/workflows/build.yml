name: OpenWrt Builder

# Manual per-board build.  "all" builds every diffconfigs/* entry; picking a
# single device builds just that one.  Both paths go through ./build.sh, which
# owns the OpenWrt checkout, the BSP sync and the docker toolchain - this
# workflow must not reimplement any of that (it used to, against a tree layout
# that no longer exists).

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device (all = build all devices)'
        required: false
        type: choice
        default: all
        # GitHub choice inputs are a static list - keep in sync with diffconfigs/.
        options:
          - all
          - hmuf02v5
          - mf800b
          - mifib-v12
          - uf02
          - uf896
          - ufi001b
          - ufi103s-v05
          - ufi003
          - uz801
          - jz02
          - jz0145
          - mifid

env:
  UPLOAD_FIRMWARE: true
  TZ: Europe/Madrid

permissions:
  contents: read

concurrency:
  # Serialize the shared cache writers with firmware releases.
  group: ${{ github.ref == 'refs/heads/main' && 'release-build' || format('openwrt-builder-{0}', github.ref) }}
  queue: max
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve device list
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.pick.outputs.devices }}
      ccache_provider: ${{ steps.pick.outputs.ccache_provider }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pick the boards to build
        id: pick
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          set -euo pipefail
          boards=()
          if [ -z "$DEVICE" ] || [ "$DEVICE" = "all" ]; then
            while IFS= read -r board; do
              boards+=("$board")
            done < <(find diffconfigs -maxdepth 1 -type f -printf '%f\n' | sort)
          else
            read -r -a boards <<< "$DEVICE"
          fi
          if [ "${#boards[@]}" -eq 0 ]; then
            echo "::error::No board selected."
            exit 1
          fi
          for board in "${boards[@]}"; do
            if [ ! -f "diffconfigs/$board" ]; then
              echo "::error::Unknown board '$board'."
              exit 1
            fi
          done
          LIST="$(python3 scripts/action_cache.py boards-json "${boards[@]}")"
          CCACHE_PROVIDER="$(python3 scripts/action_cache.py provider "${boards[@]}")"
          {
            echo "devices=$LIST"
            echo "ccache_provider=$CCACHE_PROVIDER"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Building $LIST; ccache provider: $CCACHE_PROVIDER"

  build:
    needs: setup
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.setup.outputs.devices) }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Free disk space on runner
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
        sudo apt-get clean

    - name: Determine version
      id: vars
      run: |
        VERSION="$(cat version 2>/dev/null || echo 25.12.6)"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "FILE_DATE=$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

    - name: Restore OpenWrt downloads and toolchain
      id: downloads-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir/toolchain-aarch64_generic_gcc-14.3.0_musl
          openwrt/staging_dir/host
        key: openwrt-downloads-v1-${{ hashFiles('devenv/.env', 'devenv/dependencies.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          openwrt-downloads-v1-${{ hashFiles('devenv/.env', 'devenv/dependencies.sh') }}-
          openwrt-cache-${{ steps.vars.outputs.version }}-
          openwrt-cache-
          openwrt-pr-cache-

    - name: Restore ccache
      id: ccache-cache
      uses: actions/cache/restore@v5
      with:
        path: ccache
        key: openwrt-ccache-v1-${{ hashFiles('devenv/.env', 'devenv/dependencies.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          openwrt-ccache-v1-${{ hashFiles('devenv/.env', 'devenv/dependencies.sh') }}-

    - name: Restore HMUF02V5 build intermediates
      id: hmuf-cache
      if: matrix.device == 'hmuf02v5'
      uses: actions/cache/restore@v5
      with:
        path: |
          openwrt/build_dir
          openwrt/staging_dir/target-aarch64_generic_musl
          openwrt/.hmuf02v5-cache-state
        key: openwrt-hmuf02v5-v1-${{ hashFiles('version', 'devenv/.env', 'devenv/dependencies.sh', 'devenv/Dockerfile', 'build.sh', 'scripts/openwrt-prepare.sh', 'scripts/configure-openwrt-ccache.sh', 'scripts/openwrt_intermediate_cache.py', 'diffconfigs/hmuf02v5', 'msm89xx/**', 'packages/**', 'openwrt-overlay/**', 'openwrt-patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          openwrt-hmuf02v5-v1-${{ hashFiles('version', 'devenv/.env', 'devenv/dependencies.sh', 'devenv/Dockerfile', 'build.sh', 'scripts/openwrt-prepare.sh', 'scripts/configure-openwrt-ccache.sh', 'scripts/openwrt_intermediate_cache.py', 'diffconfigs/hmuf02v5', 'msm89xx/**', 'packages/**', 'openwrt-overlay/**', 'openwrt-patches/**') }}-

    - name: Build docker builder image & prepare OpenWrt tree
      env:
        APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
      run: |
        ./build.sh prepare
        if [ -z "$APK_SIGNING_KEY" ]; then
          echo "::error::APK_SIGNING_KEY secret is not set."
          echo "::error::Without it the feed would be signed with a random, per-build key"
          echo "::error::and every device would reject it with 'UNTRUSTED signature'."
          exit 1
        fi
        printf '%s\n' "$APK_SIGNING_KEY" > openwrt/private-key.pem

    - name: Compile the firmware
      run: ./build.sh build "${{ matrix.device }}"

    - name: Save OpenWrt downloads and toolchain
      if: github.ref == 'refs/heads/main' && matrix.device == needs.setup.outputs.ccache_provider
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir/toolchain-aarch64_generic_gcc-14.3.0_musl
          openwrt/staging_dir/host
        key: openwrt-downloads-v1-${{ hashFiles('devenv/.env', 'devenv/dependencies.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Retire older downloads caches after upload
      if: always() && github.ref == 'refs/heads/main' && matrix.device == needs.setup.outputs.ccache_provider
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_KEY: openwrt-downloads-v1-${{ hashFiles('devenv/.env', 'devenv/dependencies.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
      run: python3 scripts/action_cache.py prune-after-save "$CACHE_KEY"

    - name: Save ccache
      if: github.ref == 'refs/heads/main' && matrix.device == needs.setup.outputs.ccache_provider
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: ccache
        key: openwrt-ccache-v1-${{ hashFiles('devenv/.env', 'devenv/dependencies.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Retire older ccache entries after upload
      if: always() && github.ref == 'refs/heads/main' && matrix.device == needs.setup.outputs.ccache_provider
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_KEY: openwrt-ccache-v1-${{ hashFiles('devenv/.env', 'devenv/dependencies.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
      run: python3 scripts/action_cache.py prune-after-save "$CACHE_KEY"

    - name: Save HMUF02V5 build intermediates
      if: github.ref == 'refs/heads/main' && matrix.device == 'hmuf02v5'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: |
          openwrt/build_dir
          openwrt/staging_dir/target-aarch64_generic_musl
          openwrt/.hmuf02v5-cache-state
        key: openwrt-hmuf02v5-v1-${{ hashFiles('version', 'devenv/.env', 'devenv/dependencies.sh', 'devenv/Dockerfile', 'build.sh', 'scripts/openwrt-prepare.sh', 'scripts/configure-openwrt-ccache.sh', 'scripts/openwrt_intermediate_cache.py', 'diffconfigs/hmuf02v5', 'msm89xx/**', 'packages/**', 'openwrt-overlay/**', 'openwrt-patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Retire older HMUF02V5 caches after upload
      if: always() && github.ref == 'refs/heads/main' && matrix.device == 'hmuf02v5'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_KEY: openwrt-hmuf02v5-v1-${{ hashFiles('version', 'devenv/.env', 'devenv/dependencies.sh', 'devenv/Dockerfile', 'build.sh', 'scripts/openwrt-prepare.sh', 'scripts/configure-openwrt-ccache.sh', 'scripts/openwrt_intermediate_cache.py', 'diffconfigs/hmuf02v5', 'msm89xx/**', 'packages/**', 'openwrt-overlay/**', 'openwrt-patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
      run: python3 scripts/action_cache.py prune-after-save "$CACHE_KEY"

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/msm89xx/msm8916
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware
      uses: actions/upload-artifact@v6
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: openwrt_firmware_${{ matrix.device }}_${{ steps.vars.outputs.version }}_${{ env.FILE_DATE }}
        path: |
          ${{ env.FIRMWARE }}/*-msm89xx-*-squashfs-gpt_both0.bin
          ${{ env.FIRMWARE }}/*-msm89xx-*-squashfs-gpt-7405568.bin
          ${{ env.FIRMWARE }}/*-msm89xx-*-squashfs-boot.img
          ${{ env.FIRMWARE }}/*-msm89xx-*-squashfs-system.img
          ${{ env.FIRMWARE }}/*-msm89xx-*-squashfs-sysupgrade.bin
          ${{ env.FIRMWARE }}/*-msm89xx-*.manifest
          ${{ env.FIRMWARE }}/*-msm89xx-*-flash.sh
          ${{ env.FIRMWARE }}/*-msm89xx-*-firmware.zip

  cache-cleanup:
    name: Keep only the latest OpenWrt caches
    needs: [setup, build]
    if: always() && needs.setup.result == 'success' && needs.build.result != 'cancelled' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Prune superseded cache entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/action_cache.py prune
